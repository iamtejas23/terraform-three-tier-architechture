# Local test stack — mirrors the AWS 3-tier architecture without any AWS credentials.
# Usage:
#   docker compose up --build
#   curl http://localhost:8080/health
#   curl http://localhost:8080/db/init
#   curl http://localhost:8080/data

services:
  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      ENVIRONMENT: "local"
      # Local DB — bypasses Secrets Manager
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: localpassword
      DB_NAME: appdb
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: localpassword
      MYSQL_DATABASE: appdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocalpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
